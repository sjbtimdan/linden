<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CAF50"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="0.6" stop-color="#F5B301"/>
      <stop offset="1" stop-color="#E0A800"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="290" fill="#FFFFFF"/>

  <!-- Coin: dark rim edge -->
  <circle cx="512" cy="660" r="150" fill="#B8860B"/>
  <!-- Coin: gold face -->
  <circle cx="512" cy="660" r="138" fill="url(#coin)"/>
  <!-- Coin: rim highlight -->
  <circle cx="512" cy="660" r="138" fill="none" stroke="#C98A00" stroke-width="5"/>
  <!-- Coin: inner detail ring -->
  <circle cx="512" cy="660" r="98" fill="none" stroke="#E0A800" stroke-width="7"/>

  <!-- Tree trunk -->
  <path d="M512,505 L512,430" stroke="#795548" stroke-width="26" stroke-linecap="round"/>

  <!-- Tree canopy: rounded crown of overlapping leaves -->
  <circle cx="512" cy="360" r="82" fill="#43A047"/>
  <circle cx="450" cy="388" r="54" fill="#43A047"/>
  <circle cx="574" cy="388" r="54" fill="#43A047"/>
  <circle cx="512" cy="308" r="50" fill="#43A047"/>
  <!-- Canopy highlights -->
  <circle cx="512" cy="342" r="46" fill="#66BB6A"/>
  <circle cx="478" cy="372" r="30" fill="#66BB6A"/>
  <circle cx="546" cy="372" r="30" fill="#66BB6A"/>
</svg>
